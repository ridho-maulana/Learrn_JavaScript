<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
         /*
         Getter dan setter di Class
          -Class juga mendukung pembuatan getter dan setter
          -Perlu diingat,getter dan setter ini akan berada di
           prototype,bukan di instance object
         */

         class Person{
            aku = "<p>OKe";
            constructor(firstName,middleName,lastName){
                this.firstName = firstName;
                this.middleName = middleName;
                this.lastName = lastName;
            }

            get fullName(){
                return `<p>${this.firstName} ${this.middleName} ${this.lastName}`;
            }

            set fullName(value){
                const result = value.split(" ");
                this.firstName = result[0];
                this.middleName = result[1];
                this.lastName = result[2];
            }
         }

         const Ridho = new Person("Ridho","Maulana","C");
         document.writeln(Ridho.fullName);
         Ridho.fullName = "Abdurrahman ihsan Alansori";
         document.writeln(Ridho.fullName)
         document.writeln(Ridho.aku)
    </script>
</body>
</html>
