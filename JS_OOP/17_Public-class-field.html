        /*
        Public Class Field
         -Dalam proposal tersebut juga disebut bahwa ES
          akan mendukung access modifier public dan private
         -Public artinya bisa diakses dari luat class,dan
          private hanya bisa diakses dari dalam class saja
         -Private class field akan dibahas di chapter selanjutnya
         -Untuk membuat public class field,kita bisa langsung buat
          nama field dengan value nya selevel dengan method
         -Jika kita tidak memasukkan value ke dalam field
          tersebut,artinya field tersebut memiiliki value undefined
        */
        class Costumer{
