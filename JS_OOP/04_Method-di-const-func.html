<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        Method di Constructor Function
         -Sama seperti pada tipe data object biasanya,
          kita juga bisa menambahkan method di dalam 
          constructor function
         -Jika kita tambahkan method di constructor 
          function,secara otomatis object yang dibuat
          akan memiliki method tersebut
        */

        function Person(){
            this.firstName = ""
            this.lastName = ""
            this.sayHello = function(name){
                console.info(`Hello ${name}, My name is ${this.firstName}`);
            }
        }

        const eko = new Person()
        eko.firstName = "Eko"
        eko.lastName = "Kurniawan"
        eko.sayHello("Budi")

        const budi = new Person()
        budi.firstName = "Budi"
        budi.lastName = "Santoso"
        budi.sayHello("Eko");
    </script>
</body>
</html>
