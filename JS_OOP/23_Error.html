<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        Throw Error
         -Saat kita membuat instance object dari class
          Error,tidak lantas otomatis terjadi Error
         -Kita perlu memberitahu program kita,bahwa 
          kita akan mentrigger sebuah error terjadi,atau
          istilahnya adalah melempar eror(throw error)
         -Untuk melempar error,kita bisa gunakan kata kunci
          (throw),diikuti dengan isntance object error nya
         -Jika terjadi error,maka otomatis kode program kita
          akan berhenti,dan kita bisa melihat detail 
          errornya di console di aplikasi browser kita
        */

        class Math{
            static sum(...number){
                if(number.length === 0){
                    // throw error = new Error("Total parameter harus lebih dari 0")
                    // throw error;
                    throw new Error("Total parameter harus lebih dari 0")
                }

                let total = 0;
                for (const oke of number) {
                    total += oke;
                }
                return total;
            }
        }

        document.writeln(Math.sum());
        document.writeln(Math.sum(1,1,1,1,1))
    </script>
</body>
</html>
