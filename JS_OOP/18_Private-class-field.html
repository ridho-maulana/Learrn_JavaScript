<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        Private Class Field
         -Secara default,saat kita menambahkan field,
          maka field tersebut bisa diakses dari manapun
         -Jika kita ingin membuat field yang bersifat private
          (hanya bisa diakses di dalam class),kita bisa
          menggunakan tanda # sebelum nama field nya
         -Ini dinamakan private class field,dan hanya bisa
          diakses dari dalam class saja
        */

        class Counter{
            #counter = 0;

            increment(){
                this.#counter++;
            }

            decrement(){
                this.#counter--;
            }

            get(){
                return this.#counter;
            }
        }

        const ridho = new Counter();
        ridho.decrement();
        ridho.increment();
        ridho.increment();
        ridho.increment();

        document.writeln(ridho.get());

    </script>
</body>
</html>
