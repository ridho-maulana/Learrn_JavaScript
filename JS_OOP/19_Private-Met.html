<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oke</title>
</head>
<body>
    <script>
        /*
        Private Method
         -Sama seperti field,terdapat proposal juga untuk
          menambah fitur private method di EcmaScript
         -Dengan demikian,access modifier private juga bisa
          digunakan di method
         -Caranya sama,dengan menambahkan tanda #diawal method
          ,maka secara otomatis method tersebut adalah private
         -Ingat fitur ini masih dalam tahapan,belum benar-benar
          menjadi standard ES,jadi mungkin tidak semua browser
          mendukung fitur ini
        */

        class Person{
            say(name){
                if(name){
                    this.#sayWithName(name);
                }else{
                    this.#sayWithName();
                }
            }
            #sayWithName(name){
                if(name){
                    document.writeln(`Hello you are ${name}`);
                }else{
                    document.writeln("Hello")
                }
            }

        }

        const Ridho = new Person();
        Ridho.say()

        // document.writeln("Hello")
    </script>
</body>
</html>
