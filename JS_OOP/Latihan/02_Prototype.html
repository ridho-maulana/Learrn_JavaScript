        function Person(firstName){

        Person.prototype.identitas = function(){
            document.writeln(`<p>Nama saya Adalah ${this.firstName}`);
        };

        const ridho = new Person("Ridho")
        const Natasya = new Person("Natasya");

        ridho.sayHello("Eki");
        ridho.identitas();
    </script>
