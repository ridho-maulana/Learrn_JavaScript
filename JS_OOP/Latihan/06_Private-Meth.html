<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class Person{
            say(name){
                if(name){
                    this.#sayHello(name);
                }else{
                    this.#sayHello(undefined);
                }
            }

            #sayHello(name){
                if(name){
                    document.writeln("Hello saya Ridho")
                }else{
                    document.writeln("Hello salah")
                }
            }
        }

        const Ridho = new Person();
        Ridho.say("E");
    </script>
</body>
</html>
