<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class Employee{
            constructor(firstName){
                this.firstName = firstName;
            }

            sayHello(name){
                document.writeln(`<p>Hello ${name}, My name is  ${this.firstName}`);
            }
        }

        class Manager extends Employee{
            constructor(firstName,lastName){
                super(firstName);
                this.lastName = lastName;
                this.fullName = firstName +" "+lastName
            }

            sayHello(name){
                document.writeln(`<p>Hello ${name},My name is ${this.fullName}`)
            }
        }

        const ridho = new Employee("RIdho");
        const natasya = new Manager("Natasya","Winata");

        ridho.sayHello("Al");
        natasya.sayHello("Dabu")
    </script>
</body>
</html>
