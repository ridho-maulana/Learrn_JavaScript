<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class Employee{

        }
        class Manager extends Employee{

        }

        const budi = new Employee();
        const eko = new Manager();

        document.writeln(budi instanceof Employee)//true
        document.writeln(budi instanceof Manager) //False
        document.writeln(eko instanceof Employee) //False /true(karena inherit ke Manager)
        document.writeln(eko instanceof Manager)  //True

    </script>
</body>
</html>
