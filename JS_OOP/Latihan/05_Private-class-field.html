<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class Counter{
            #increment = 0;

            increment(){
                this.#increment++;
            }

            decrement(){
                this.#increment--;
            }

            get(){
                return this.#increment;
            }
        }

        const ridho = new Counter();

        ridho.increment();
        ridho.increment();
        ridho.increment();
        ridho.increment();
        ridho.increment();
        ridho.increment();
        ridho.increment();

        ridho.decrement();

        document.writeln(ridho.get());
    </script>
</body>
</html>
