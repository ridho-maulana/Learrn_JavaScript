<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        Parameter di construktor Function
         -Karena dalam JS,class adalah berbentuk function,
          jadi secara default,function tersebut
          bisa memiliki parameter
         -Construktor function sama seperti function
          biasanya,bisa memiliki parameter,hal ini 
          membuat ketika kita membuat object,kita bisa
          mengirim langsung data lewat parameter di 
          construktor function tersebut
        */

        function Person(firstName,lastName){
            this.firstName = firstName;
            this.lastName = lastName;
            this.sayHello = function(name){
                document.writeln(`Hello ${name}, My name is ${this.firstName}`);
            }
        }

        const eko = new Person("Eko","Kurniawan");
        eko.sayHello("Ridho") 
    </script>
</body>
</html>
