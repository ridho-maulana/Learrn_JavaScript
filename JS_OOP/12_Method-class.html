<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        Method di Class
         -Membuat method di class sebenarnya bisa dilakukan
          dengan cara seperti menambahkan method di
          construktor function
         -Namun,hal tersebut sebenarnya menambahkan method
          ke dalam instance object
         -Khusus untuk method sebaiknya kita menambahkan ke
          prototype,bukan ke instance object
         -Untung nya di-class,ada cara mudah menambahkan method
          dan secara otomatis ditambahkan ke prototype
        */

        class Person{
            constructor(name){
                this.name = name;
            }

            sayHello(name){
                document.writeln(`Hello ${name},My name is ${this.name}`)
            }
        }

        const ridho = new Person("Ridho");
        ridho.sayHello("Eko");
    </script>
</body>
</html>
