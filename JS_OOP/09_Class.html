<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        Membuat Class
         -Sejak EcmaScript6,diperkenalkan kata kunci baru,
          yaitu class,ini merupakan kata kunci yang digunakan
          untuk membuat class di JS
         -Dengan kata kunci class,kita tidak perlu lagi 
          menggunakan construktor function untuk membuat
          class
        */

        class Person{
    
        }

        Person.prototype.sayHello = function(){
            document.writeln(`Hello semya`)
        }

        const eko = new Person();
        eko.sayHello();
    </script>
</body>
</html>
