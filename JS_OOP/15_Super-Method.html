<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class Shape{
            paint(){
                document.writeln(`<p>Paint shape</p>`)
            }
        }

        class Circle extends Shape{
            paint(){
                //Super Method
                super.paint();
                document.writeln(" Ini tambahan")
            }
        }

        const Ridho = new Shape();
        const Natasya = new Circle();

        Ridho.paint();
        Natasya.paint();
    </script>
</body>
</html>
