<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        CONSOLE
         -JavaScript Memiliki fitur untuk melakukan
          logging bernama console
         -Logging adalah mekanisme yang biasa dilakukan oleh
          programmer untuk menampilkan informasi dari aplikasi
          yang sedang berjalan,tanpa harus mengganggu alur
          kerja aplikasi dan juga interaksi user
         -Untuk menggunakan Console,kita cukup gunakan
          perintah console di kode JavaScript 

        CONSOLE METHOD
         1.console.info()  --  Memberitahu informasi
         2.console.warn()  --  Memberitahu informasi peringatan
         3.console.error() --  Memberitahu informasi error
         4.console.table() --  Memberitahu informasi dalam
                               bentuk table
        */

        console.info("Hello World");

        console.warn("Ini Peringatan");

        console.error("Ini Error")


    </script>
</body>
</html>
