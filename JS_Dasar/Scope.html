<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        Scope
         -Scope merupakan area akses sebuah data
         -Ada uda jenis scope,global scope dan local scope
         -Setiap kita membuat function,maka kita akan membuat
          local scope untuk membuat local scope untuk function
          tersebut
         -Data di global scope bisa diakses dari local scope
          ,namun data di local scope hanya bisa diakses di 
          local scope tersebut atau di scope local dibawahnya
          (dalam kasus function dalam  function)
        */

        //Global Scope
        let counter = 0;

        function hitMe(){
            //local scope function hitMe
            counter++;//we can access
        }
    </script>
</body>
</html>
