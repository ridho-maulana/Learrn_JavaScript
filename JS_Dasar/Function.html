<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        FUNCTION
         -Untuk membuat function,kita bisa menggunakan
          kata kunc function,lalu diikuti dengan nama
          function,kurung() dan diakhiri dengan block 
          kurung{}
         -Kita bisa memanggil function dengan menggunakan
          nama function lalu diikuti dengan kurung()
         -Di bahasa pemrograman lain,function juga disebut
          dengan method
        */

        //Membuat function
        function sayHelloWorld(){
            document.writeln("<p>Hello world</p>");
        }
        //Memanggil function
        sayHelloWorld();
        sayHelloWorld();
        sayHelloWorld();
    </script>
</body>
</html>
