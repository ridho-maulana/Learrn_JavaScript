<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator logika non boolean</title>
</head>
<body>
    <script>
        /*
        OPERATOR LOGIKA NON BOOLEAN
         -Sebelumnya kita sudah tahu bahwa operator 
          logika AND(&&) dan OR(||) digunakan untuk
          dua data Boolean
         -Namun berbeda di JS,kita bisa menggunakan
          operator logika AND dan OR untuk tipe data
          non boolean

        OPERATOR OR(||) DI NON BOOLEAN
         -Operator logika OR(||),membaca dari kiri ke kanan
         -Operator ini akan mengambil nilai pertama yang truthy
         -Jika tidak ada satupun yang bernilai truthy,maka yang
          terakhir yang akan diambil

        OPERATOR AND(&&) DI NON BOOLEAN
         -Operator logika AND(||),membaca dari kiri ke kanan
         -Operator ini akan mengambil nilai pertama yang falsy
         -Jika tidak ada satupun yang bernilai falsy,
          maka yang terakhir yang akan diambil
        */

        //OR
            console.info("hello" || ''); //hello
            console.info("" || []);//[]
            console.info("0" || "NOL");//0
            console.info(1 || "NOL");//NOL
            console.info(null || "NULL");//NULL
            console.info(undefined || "UNDEFINED");//
        //AND
            console.info("hello" && '')//''
            console.info("" && [])//""
            console.info("0" && "NOL")//"NOL"
            console.info(0 && "NOL")//0
            console.info(null && "NULL")//null
            console.info(undefined && "UNDEFINED");//undefined
            console.info("undefined" && "null")//null
    </script>
    
</body>
</html>
