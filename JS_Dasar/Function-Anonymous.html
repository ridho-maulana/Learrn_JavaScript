<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        Anonymous Function
         -Sebelumnya kita selalu membuat function
          dengan nama
         -Kita juga bisa membuat function tanpa nama
          function,atau istilahnya adalah anonymous 
          function
         -Kita bisa buat anonymous function dalam sebuah
          variabel atau bisa juga kita buat ketika mengisi
          parameter
        */

        //
        let say = function(name){
            document.writeln(`<p>Hello ${name}</p>`);
        }
        say("Olandro");

        //
        function giveMeName(callback){
            callback("Ridho");
        }
        
        giveMeName(say);

        giveMeName(function(name){
            document.writeln(`<p>Haii ${name}</p>`) 
        })
        
    </script>
</body>
</html>
