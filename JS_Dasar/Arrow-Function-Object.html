<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        Arroww Function di Object
         -Sebelumnya kita sudah bahas tentang
          Arrow function
         -Arrow Function juga bisa kita gunakan
          sebagai Object Method
         -Namun perlu diketahui,Arrow Function tidak
          bisa digunakan untuk mengakses arguments object,
          function generator,kata kunci this dan kata
          kunci super(Di OOP)
         -Jadi pasti gunakan Arrow Fuction hanya memang
          ketika kita tidak butuh fitur-fitur diatas
        */

        const person = {
            name : "Ridho",
            sayHello : name =>{
                document.writeln(this);
                document.writeln(`<p>Hello ${name}`);
            }
        }

        person.sayHello();
    </script>
</body>
</html>
