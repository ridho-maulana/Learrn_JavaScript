<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        FUNCTION PARAMETER
         -Parameter ditempatkan di dalam kurung()
          di deklarasi method
         -Parameter bisa lebih dari satu,jika lebih
          dari satu,harus dipisah menggunakan tanda koma
        */

        function sayHello(firstName,lastName){
            document.writeln(`<p>Hello ${firstName} ${lastName}</p>`);
        };

        sayHello("Ridho","Maulana");
        sayHello("Al","Davu")

        //Default parameter
        function register(name,gender = "UNKNOW"){
            console.log(name);
            console.log(gender)
        }

        register("Ridho","MALE");
        register("Budi");
        register("Joko",undefined);
    </script>
</body>
</html>
