<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        FOR OF
         -Jika For in digunakan untuk melakukan iterasi
          property atau index,berbeda dengan For of,ini
          digunakan untuk melakukan iterasi terhadap isi
          value dari iterable object,seperti Array,String
          dan lain-lain
         -For of tidak bisa digunakan untuk melakukan iterasi
          data di object,karena object bukanlah iterable
        */

        const names = ["Eko","Kurniawan","Khannedy"];

        for(const name of names){
            document.writeln(`<p>Name : ${name}</p>`)
        }
    </script>
</body>
</html>
