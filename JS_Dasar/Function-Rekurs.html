<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function factorial(value){
            let result = 1;
            for(let  i = 1; i <= value; i++){
                result *= i;
            }

            return result;
        }
        console.info(factorial(5));

        //Factorial Recursive
        function factorialRecursive(values){
            if(values == 1){
                return 1;
            }else{
                return values * factorialRecursive(values -1);
            }
        }
        console.info(factorialRecursive(6));
    </script>
</body>
</html>
