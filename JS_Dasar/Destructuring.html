<body>
    <script>
        `use strict`;  
        /*
        Destructuring
         -Desctructuring adalah fitur yang bisa digunakan
          untuk membongkar value-value di array atau
          object ke dalam variabel-variable
         -Fitur ini sangat mempermudah kita ketika ingin
          mengambil data dari array atau object tanpa 
          harus melalukan pemgambilan data satu persatu

        Descructing Function Parameter
         -Descructing tidak hanya bisa dilakukan di variabel
          ,tapi juga bisa dilakukan di function parameter
         -Hal ini membuat kita mudah ketika ingin mengambil
          nested data dalam array atau object dalam function
        
        Default Valus
         -Yang paling menarik di descructuring adalah,
          kita bisa menambahkan default value nya
         -Jadi misal kita melakukan descructuing terhadap
          array,ternyata tidak ada datanya,maka kita bisa 
          menambahkan default valuenya
         -Begitu juga pada object,jika ternyata proeprty 
          nya tidak ada,maka kita bisa menambahkan default
          valuenya

        Menggunakan nama variabel lain
         -Saat melakukan destructuring di array,kita bisa
          dengan mudah membuat nama variabel sesuka
          kita
         -Namun pada saat melakukan destructuring,kita harus
          membuat nama variabel sama dengan nama property
         -Kita juga bisa menggunakan nama variabel lain saat
          melakukan destructuring object jika kita mau
        */

        //Normal data di object

            firstName: "Eko",

        // document.writeln(`<p>${other}`) 
        
            
        //Descruction di Function parameter
        function displayPerson({firstName,middleName,lastName}){
            document.writeln(firstName);
            document.writeln(middleName);
            document.writeln(lastName);
        }
        const orang = {
            firstName : "Ridho",
            middleName : "Maulana",
            lastName : "Candra"
        };
        displayPerson(orang);

        //Descruction di Function parameter Array
        function sum([first,second]){
            return first + second; 
        }

        document.writeln(sum([10,10]))

        //Default value
        const iden = ["Natasya","Candra","Winata"];
        const [awal,tengah,akhir = "Ada"] = iden;

        document.writeln(`<p>${awal}`)
        document.writeln(`<p>${tengah}`)
        document.writeln(`<p>${akhir}`);

        //Menggunakan nama variabel lain
        const{
            firstName : namaDepan ,
            middleName :  namaTengah ,
            lastName : namaBelakang}  = orang;

        document.writeln(`</br></br><p>${namaDepan}</p>`)
        document.writeln(`<p>${namaTengah}</p>`)
        document.writeln(`<p>${namaBelakang}</p>`)
