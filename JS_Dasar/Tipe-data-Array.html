        /*
        OPERASI ARRAY
        1.array.push(value)
            Menambah data ke array
        2.array.length
            Untuk mendapatkan panjang Array
        3.array[index]
            Mendapatt data di posisi index
        4.array[index] = value
            Mengubah data di posisi index
        5.delete array[index]
            Menghapus data di posisi index,
            namun index tidak bergeser
        */
