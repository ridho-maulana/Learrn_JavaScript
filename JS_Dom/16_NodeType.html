<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Eko Kurniawan Khannedy
    <!-- Hello World -->
    <script>
        /*
        Node Type
         -Saat kita menyeleksi Node menjadi NodeList,kadang kita
          ingin tahu tipe Node tersebut 
         -Apakah Element,TextElement atau yang lainnya
         -Node sendiri memiliki property bernama nodeType,dimana kita
          bisa melihat tipe dari Node tersebut
         -https://developer.mozilla.org/en-US/docs/Web/API/Node/node
        */

        const nodes = document.body.childNodes;
        nodes.forEach(node => {
            console.info(`${node} : ${node.nodeType}`);
        })
    </script>
</body>
</html>
