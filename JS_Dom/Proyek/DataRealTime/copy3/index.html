<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
</head>
<body>
    <div class="container">
        <h2>Cari Kontak / Nama</h2>
        <input type="text" id="inputText" placeholder="Ketika nama yang dicari...">

        <ul id="daftarItem">
            <li>Ridho Maulana</li>
            <li>Budi Santoso</li>
            <li>Siti Aminah</li>
            <li>Joko Widodo</li>
            <li>Dewi Lestari</li>
            <li>Ahmad Dhani</li>
        </ul>
    </div>

    <script>
        const inputText = document.getElementById("inputText");
        const daftarItem = document.querySelectorAll("#daftarItem li");

        inputText.addEventListener("input",function(event){
            const textInput = event.target.value.toLowerCase();

            daftarItem.forEach(function(daftar){
                const daftarku = daftar.textContent.toLowerCase();

                if(daftarku.includes(textInput)){
                    daftar.style.display = "block";
                }else{
                    daftar.style.display = "none";
                }
            })
        })
    </script>
</body>
</html>
