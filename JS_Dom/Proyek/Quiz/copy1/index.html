<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color:#f0f2f5;
            
            display:flex;
            justify-content: center;
            align-items: center;
            height:100vh;
            margin:0;
        }
        .quiz-container{
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2{
            font-size:1.2rem;
            color:#333;
        }
        .btn-container{
            display:flex;
            flex-direction: column;
            gap:10px;
            margin-top:20px;
        }

        /*  */
        .option-btn{
            padding:12px;
            background-color: #f8f9fa;
            border:1px solid #ccc;
            border-radius:5px;
            cursor:pointer;
            text-align: left;
            font-size:1rem;
            transition:0.2s;
        }
        .option-btn:hover{
            background-color:#e2e6ea;
            border-color:#adb5bd;
        }

        #resultContainer{
            text-align: center;
        }  
        #restartBtn{
            padding:10px 20px;
            background-color:#007bff;
            color:white;
            border: none;
            border-radius:5px;
            cursor:pointer;
            margin-top:15px;
        }
        #restartBtn:hover{
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="quiz-container" id="quizBox">
        <div id="questionBox">
            <h2 id="questionTitle">Pertanyaan akan muncul di sini...</h2>
            <div class="btn-container" id="optionsBox">
                <!-- Tombol pilihan ganda dirender lewat JS -->
            </div>
        </div>

        <div id="resultContainer"  style="display: none;">
            <h2>Kuis Selesai!</h2>
            <p id="scoreText">Skor Anda: 0</p>
            <button id="restartBtn">Ulangi Kuis</button>
        </div>
    </div>

    <script>
        //1.Data soal kuis(Array berisi Object)
        const quizData = [
            {
                question:"Apa fungsi dari tag HTML '<a>'?",
                options:["Membuat paragraf","Membuat tautan/link","Membuat gambar","Membuat tabel"],
                answer:1//index opsi yang benar(pilihan ke-2: "Membuat tautan/link")
            },
            {
                question:"Method JS apa yang digunakan untuk memilih elemen berdasarka ID?",
                options:["document.querySelector()","document.getElementsByClassName()","document.createElement()"],
                answer:2
            },
            {
                question:"Properti CSS apa yang digunakan untuk mengubah warna teks?",
                options:["background-color", "color", "font-size", "text-align"],
                answer:1
            },
            {
                question:"Di dalam JavaScript,perulangan (looping) mana yang umum digunakan?",
                options:["if-else", "for", "alert", "document.write"],
                answer:1
            }
        ];

        //2.Mengambil elemen DOM yang dibutuhkan
        const questionBox = document.getElementById("questionBox");
        const questionTitle = document.getElementById("questionTitle");
        const optionsBox = document.getElementById("optionsBox");

        const resultContainer = document.getElementById("resultContainer");
        const scoreText = document.getElementById("scoreText");
        const restartBtn = document.getElementById("restartBtn");

        //3. State/Status Kuis
        let currentQuizIndex = 0;
        let score = 0;

        //4.Fungsi untuk Memuat Soal ke Halaman
        function loadQuiz(){
            //Ambil data soal berdasarkan indeks saat ini
            const currentQuiz = quizData[currentQuizIndex];

            //Masukkan teks pertanyaan
            questionTitle.textContent = `${currentQuizIndex + 1}. ${currentQuiz.question}`;

            //Kosongkan pilihan tombol sebelumnya
            optionsBox.innerHTML = "";

            //Buat tombol opsi jawaban secara dinamis menggunakan looping(foreach)
            currentQuiz.options.forEach(function(optionText,index){
                const button = document.createElement("button");
                button.textContent = optionText;
                button.classList.add("option-btn");

                //event ketika pilihan jawaban diklik
                button.addEventListener("click",function(){
                    //cek apakah jawaban benar
                    if(index === currentQuiz.answer){
                        score++;
                    }

                    //Lanjut ke soal berikutnya
                    currentQuizIndex++;
                    
                    //Jika masih ada soal,load soal berikutnya.jika habis, tampilkan hasil
                    if(currentQuizIndex < quizData.length){
                        loadQuiz();
                    }else{
                        showResult();
                    }
                })

                optionsBox.append(button);
            })
        }


        //5. fungsi Menampilkan Haisl Akhir
        function showResult(){
            questionBox.style.display = "none";
            resultContainer.style.display = "block";
            scoreText.textContent = `Skor anda: ${score} dari ${quizData.length}`;
        }

        //6.Tombol Ulangi Kuis
        restartBtn.addEventListener("click",function(){
            currentQuizIndex = 0;
            score = 0;
            questionBox.style.display = "block";
            resultContainer.style.display = "none";
            loadQuiz();
        });

        //jalankan kuis saat pertama kali dibuka
        loadQuiz();

    </script>
</body>
</html>
