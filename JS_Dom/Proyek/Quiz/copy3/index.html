<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color:#f0f2f5;
            
            display:flex;
            justify-content: center;
            align-items: center;
            height:100vh;
            margin:0;
        }
        .quiz-container{
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2{
            font-size:1.2rem;
            color:#333;
        }
        .btn-container{
            display:flex;
            flex-direction: column;
            gap:10px;
            margin-top:20px;
        }

        /*  */
        .option-btn{
            padding:12px;
            background-color: #f8f9fa;
            border:1px solid #ccc;
            border-radius:5px;
            cursor:pointer;
            text-align: left;
            font-size:1rem;
            transition:0.2s;
        }
        .option-btn:hover{
            background-color:#e2e6ea;
            border-color:#adb5bd;
        }

        #resultContainer{
            text-align: center;
        }  
        #restartBtn{
            padding:10px 20px;
            background-color:#007bff;
            color:white;
            border: none;
            border-radius:5px;
            cursor:pointer;
            margin-top:15px;
        }
        #restartBtn:hover{
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="quiz-container" id="quizBox">
        <div id="questionBox">
            <h2 id="questionTitle">Pertanyaan akan muncul di sini...</h2>
            <div class="btn-container" id="optionsBox">
                <!-- Tombol pilihan ganda dirender lewat JS -->
            </div>
        </div>

        <div id="resultContainer"  style="display: none;">
            <h2>Kuis Selesai!</h2>
            <p id="scoreText">Skor Anda: 0</p>
            <button id="restartBtn">Ulangi Kuis</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                pertanyaan : "Tag apa yang digunakan untuk membuat garis panjang?",
                pilihan:["Tag <p>","Tag <h1>","Tag <div>","Tag <hr>"],
                jawaban: 3
            },
            {
                pertanyaan : "Style css apa untuk memberi warna latar belakang?",
                pilihan:["display:","font-size","background-color","text-align"],
                jawaban: 2
            },
            {
                pertanyaan : "Perulangan apa yang sering dipakai di JS",
                pilihan:["perulangan For","Perulangan While","Perulangan Do While","Perulangan Swit-case"],
                jawaban: 0
            },
            {
                pertanyaan : "Apa yang terjadi Jika tag <p> diberi font-size",
                pilihan:["Warnanya berubah","Font nya jadi italic","Ukuran font-berubah","font nya jadi menghilang"],
                jawaban: 2
            }
        ];

        const questionBox = document.getElementById("questionBox");
        const questionTitle = document.getElementById("questionTitle");
        const optionsBox = document.getElementById("optionsBox");

        const resultContainer = document.getElementById("resultContainer");
        const scoreText = document.getElementById("scoreText");
        const restartBtn = document.getElementById("restartBtn");

        let indexquiz = 0;
        let score = 0;

        function quiz(){
            const kuisdata = quizData[indexquiz];
            questionTitle.textContent = kuisdata.pertanyaan;
            
            optionsBox.innerHTML = "";

            kuisdata.pilihan.forEach(function(pilih,index){
              const button = document.createElement("button");   
              button.textContent = pilih;
              button.classList.add("option-btn");
                
              button.addEventListener("click",function(){
                if(index === kuisdata.jawaban){
                    score++;
                };

                indexquiz++;

                if(indexquiz < quizData.length){
                    quiz();
                }else{
                    result();
                }
              })

              optionsBox.append(button);
            })
        }

        function result(){
            resultContainer.style.display = "block";
            questionBox.style.display = "none";  
            scoreText.textContent = `Score Anda ${score}`;
        }

        restartBtn.addEventListener("click",function(){
              indexquiz = 0;
              score = 0;
              resultContainer.style.display = "none"
              questionBox.style.display = "block"
        })

        quiz();  
    </script>
</body>
</html>
