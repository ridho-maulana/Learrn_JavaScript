<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color:#f0f2f5;
            
            display:flex;
            justify-content: center;
            align-items: center;
            height:100vh;
            margin:0;
        }
        .quiz-container{
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2{
            font-size:1.2rem;
            color:#333;
        }
        .btn-container{
            display:flex;
            flex-direction: column;
            gap:10px;
            margin-top:20px;
        }

        /*  */
        .option-btn{
            padding:12px;
            background-color: #f8f9fa;
            border:1px solid #ccc;
            border-radius:5px;
            cursor:pointer;
            text-align: left;
            font-size:1rem;
            transition:0.2s;
        }
        .option-btn:hover{
            background-color:#e2e6ea;
            border-color:#adb5bd;
        }

        #resultContainer{
            text-align: center;
        }  
        #restartBtn{
            padding:10px 20px;
            background-color:#007bff;
            color:white;
            border: none;
            border-radius:5px;
            cursor:pointer;
            margin-top:15px;
        }
        #restartBtn:hover{
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="quiz-container" id="quizBox">
        <div id="questionBox">
            <h2 id="questionTitle">Pertanyaan akan muncul di sini...</h2>
            <div class="btn-container" id="optionsBox">
                <!-- Tombol pilihan ganda dirender lewat JS -->
            </div>
        </div>

        <div id="resultContainer"  style="display: none;">
            <h2>Kuis Selesai!</h2>
            <p id="scoreText">Skor Anda: 0</p>
            <button id="restartBtn">Ulangi Kuis</button>
        </div>
    </div>
 
    <script>
        const quizData = [
            {
                question:"Apa fungsi dari tag HTML '<a>'?",
                options:["Membuat paragraf","Membuat tautan/link","Membuat gambar","Membuat tabel"],
                answer:1//index opsi yang benar(pilihan ke-2: "Membuat tautan/link")
            },
            {
                question:"Method JS apa yang digunakan untuk memilih elemen berdasarka ID?",
                options:["document.querySelector()","document.getElementsByClassName()","document.createElement()"],
                answer:2
            },
            {
                question:"Properti CSS apa yang digunakan untuk mengubah warna teks?",
                options:["background-color", "color", "font-size", "text-align"],
                answer:1
            },
            {
                question:"Di dalam JavaScript,perulangan (looping) mana yang umum digunakan?",
                options:["if-else", "for", "alert", "document.write"],
                answer:1
            }
        ];

        const questionBox = document.getElementById("questionBox");
        const questionTitle = document.getElementById("questionTitle");
        const optionBox = document.getElementById("optionsBox");

        const resultContainer = document.getElementById("resultContainer");
        const scoreText = document.getElementById("scoreText");
        const restartBtn = document.getElementById("restartBtn");

        let indexquiz = 0;
        let score = 0;

        function playQuiz(){
            const pertanyaan = quizData[indexquiz];
            questionTitle.textContent = pertanyaan.question;

            optionBox.innerHTML = "";

            pertanyaan.options.forEach(function(data,index){
                const pilih = document.createElement("button");
                pilih.textContent = data;
                pilih.classList.add("option-btn");
                
                pilih.addEventListener("click",function(){
                    if(index === pertanyaan.answer){
                        score++;
                    }

                    indexquiz++;

                    if(indexquiz < quizData.length){
                        playQuiz()
                    }else{
                        hasil();
                    }
                })

                optionBox.append(pilih);
            });
        }

        function hasil(){
            questionBox.style.display = "none";
            resultContainer.style.display = "block";
            scoreText.textContent = `Score Anda: ${score}`;
        }

        restartBtn.addEventListener("click",function(){
            indexquiz = 0;
            score = 0;
            resultContainer.style.display = "none";
            questionBox.style.display = "block";
        })
            
        playQuiz();
    </script>
</body>
</html>
