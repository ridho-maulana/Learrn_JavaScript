<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Event Target -->
    <input type="button" value="Click Me!" id="clickMe">

    <!-- Global Event Handler -->\
    <input type="button" id="click" value="Pencet Saya">
    <script>
        /*
        Event Target
         -Event Target merupakan parent class dari Node,
          artinya semua Node memiliki kemampuan dari Event Target
         -Pada Event Target,kita bisa menggunakan method
          addEventListener(type,callback) untuk menambahkan
          Event Handler
         -https://developer.mozilla.org/en-US/docs/Web/API/EventTarget
        */
        
        //Event Target-->Bisa berkali-kali
        const clickMe = document.getElementById("clickMe")
        clickMe.addEventListener("click",function(){
            clickMe.setAttribute("value","You Already Click ME!");
        })

        /*
        Global Event Handler
         -Selain menggunakan Event Target,untuk menambahkan
          Event Handler,kita juga bisa menggunakan Global Event
          Handler
         -Global Event Handler bukanlah sebuah super class,hanya
          kontrak yang bisa kita gunakan untuk menambah event handler
          sesuai dengan type event nya
         -https://developer.mozilla.org/en-US/docs/Web/API/GlobalEventHandlers
        */

        //Global Event Handler-->Hanya bisa satu
        const click = document.getElementById("click");
        click.onclick = function(){
            click.setAttribute("value","Kamu sudah pencet saya!")
        }
        click.onclick = function(){
            click.setAttribute("value"," sudah pencet saya!")
        }
    </script>
</body>
</html>
