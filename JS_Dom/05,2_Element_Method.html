<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="content" class="content">
        <h1 id="title" class="titlep">
            This is Title
        </h1>
        <p id="description" class="description">
            This is Description
        </p>
    </div>

    <div class="tambah" id="tambah">

    </div>
    <script>
        /*
        Element Method
         -Element memiliki banyak sekalo method
         -Dan karena Element adalah turunan dari Node,
          semua method Node pun bisa digunakan di Element
         -https://developer.mozilla.org/en-US/docs/Web/API/Element#methods
        */

        const content = document.getElementById("content")
        const description = document.getElementById("description")
        const title = document.getElementById("title")

        console.info(content)
        description.remove()
        title.remove()


        //Membuat Element
        const tambah = document.getElementById("tambah");

        const judul = document.createElement("h1")
        judul.textContent = "Belajar JavaScript DOM";
        tambah.appendChild(judul)

        const desc = document.createElement("p");
        desc.textContent = "Selamat Belajar JavaScript DOM";
        tambah.appendChild(desc)
    </script>
</body>
</html>
