<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form name="commentForm">
        <label for="comment">
            Comment : <input id="comment" type="text" name="comment">
        </label>
        <br>
        <label for="from">
            From : <input type="text" name="from" id="from">
        </label>
        <br>
        <input type="submit" value="Submit">
    </form>
    <div id="commentList"></div>
    <script>


        /*
        Method
            -submit()
                Mengirim form tanpa memicu event submit
                dan validasi bawaan
            -requestSubmit()
                Mengirimkan form melalui mekanisme submit normal
            -reset()
                Mengembalikan form ke nilai awal
            -checkValidity()
                Memeriksa apakah seluruh kontrol  form valid
            -reportValidity()
                Memeriksa validitas sekalisgus menampilkan
                pesan validasi
        */

        document.forms['commentForm'].onsubmit = function (event){
            event.preventDefault();

            const commentList = document.getElementById("commentList");
            const comment = document.forms['commentForm']['comment'].value;
            const from = document.forms['commentForm']['from'].value;

            const commentItem = document.createElement("p");
            commentItem.textContent = `${comment} - ${from}`;
            commentList.appendChild(commentItem);

            document.forms['commentform'].reset();
        }
        /*
        HTML Form Element
         -Form adalah salah satu element yang memiliki banyak
          sekali fitur diluar dari Element DOM
         -Hal ini karena penggunaan Form memang lebih kompleks 
          dibandingkan element HTML lainnya
         -Ada banyak sekali proeprty,method dan juga event yang terdapat
          pada HTML form element atau input element
         -https://developer.mozilla.org/en-US/docs/Web/API/HTMLFormElement
         -https://developer.mozilla.org/en-US/docs/Web/API/HTMLInputElement

        Akses Form Via Name
         -Salah satu kelebihan Form adalah,kita bisa mengakses form hanya
          dengan menggunakan form name
         -Kita bisa gunakan document.forms[name]
         -Atau jika kita ingin mengakses inputnya,kita juga bisa menggunakan
          name nya document.forms[name][inputName]
        */
    </script>
</body>
</html>
