<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a id="link"></a>
    <script>
        /*
        HTML Element
         -Element merupakan representasi dalam DOM
         -Namun,saat menggunakan HTML,implementasi detailnya sebenarnya
          adalah HTML Element,yaitu turunan dari Element
         -HTML Element memiliki banyak sekali property dan method
          tambahan selain dari Element DOM
         -Kebanyakan HTML Element memiliki property yang sesuai dengan
          attribute yang ada pada tag html tersebut,oleh karena itu,
          kadang kita tidak butuh lagi menggunakan methos setAttribute
          dan getAttribute
         -https://developer.mozilla.org/en-US/docs/Web/API/HTMLElement
        */
    const link = document.getElementById("link");
    link.href = "https://github.com/"
    link.target = "";
    link.textContent = "Ridho Maulana C"
    </script>
</body>
</html>
