<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    Element Property
     -Element memiliki banyak sekali property
     -Dan karena Element adalah turunan dari Node,
      semua property Node pun bisa digunakan di Element
     -https://developer.mozilla.org/en-US/docs/Web/API/Element#properties
    -->
    <h1 id="title"></h1>
    <p id="description"></p>

    <script>
        const title = document.getElementById("title")
        title.textContent = "Belajar JavaScript DOM";

        const description = document.getElementById("description");
        description.textContent = "Selamat Belajar JavaScript DOM";
    </script>
</body>
</html>
