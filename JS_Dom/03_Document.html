<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
  /*
  Document
    -Document  merupakan representasi object dari
      halaman web
    -Dalam satu halaman web,terdapat satu document,
      dan kita tidak perlu membuatnya secara manual,
      karena otomatis akan ada di Browser
    -Untuk mengakses Document,kita bisa gunakan object
      document
  Document Object
    -Document secara otomatis dibuat ketika membuka
      halaman web,sehingga kita tidak perlu membuat object
      Document secara manual
    -Kita bisa langsung menggunakan kata kunci document
  Document Property
    -Document memiliki banyak sekali property
    -Property dalam Document bisa kita gunakan untuk
     melihat semua data yang terdapat dalam document
     halaman web
    -https://developer.mozilla.org/en-US/docs/Web/API/Document#properties
  Document Method
    -Document memiliki banyak sekali method
    -Banyak method yang terdapat di document digunakan
     untuk memanipulasi data DOM,misal membuat Node,
     Element,Attribute atau mengambil dan menyeleksi
     Node di dalam document
    -https://developer.mozilla.org/en-US/docs/Web/API/Document#methods
 */

 console.info(document);

 //Document Property
   console.info(document.title);
   console.info(document.body);
   console.info(document.head);
   console.info(document.images);
   console.info(document.contentType);
  </script>
</body>
</html>
