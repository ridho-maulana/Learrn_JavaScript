<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        Cara menggunakan querySelector
            -Memilih berdasarkan Attribute
                const email = document.querySelector('[type="email"]');
            -Memilih berdasarkan Kombinasi Selector
                const judul = document.querySelector(".container #judul")
                    Artinya,JS mencari elemen dengan ID judul yang berada
                    di dalam elemen dengan class container
            -yang lainnya
                1."li:first-child"
                    memilih li yang merupakan anak pertama
                2."li:last-child" 
                    Memilih li yang merupakan anak terkahir
                3."li:nth-child(2)"
                    Memilih li anak kedua
        */
    </script>
</body>
</html>
