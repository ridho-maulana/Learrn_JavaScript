<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="daftar">
        <li>HTML</li>
    </div>
    <script>
        /*
        Operator innerHTML
            Ada hal menarik,kita bisa gunakan operator
            += untuk menambahkan HTML tanpa ganti
            seluruh isi sebelumnnya
        */
        const daftar = document.querySelector("#daftar");
        daftar.innerHTML += "<li>CSS</li>"
        daftar.innerHTML += "<li>JavaScript</li>"
    </script>
</body>
</html>
