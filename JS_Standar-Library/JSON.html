<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        Pengenalan JSON
         -JSON singkatan dari JavaScript Object Notation
         -JSON merupakan data string yang bentuknya
          mirip dengan JS Object
         -Saat ini JSON banyak sekali digunakan untuk
          komunikasi antara server dan client

        JSON
         -JavaScript mendukung konversi data dari string
          json ke Object ataupun sebaliknya
         -JSON.stringify()
            digunakan untuk melakukan
            konversi dari Object ke String
         -JSON.parse()
            digunakan untuk melakukan konversi
            dari string ke Object 
        */

        const person = {
            firstname : "Eko",
            lastName : "Khannedy",
            address: {
                country : "Indonesia",
                city : "Subang"
            }
        };

        const json = JSON.stringify(person);
        const personAgain = JSON.parse(json);

        console.info(json);
        console.info(personAgain);
    </script>
</body>
</html>
