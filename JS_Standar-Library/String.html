<body>
    <script>
        /*
        String
         -Tipe data string sudah kita bahas pada materi
          JS Dasar
         -Namun kita belum membahas instance.method atau juga
          instance properties yang terdapat di string
        
        String Instance Method dan properties
         -String sendiri memiliki banyak sekali instance
          method dan poperties
         -Hal ini menjadikan untuk memaniipulasi data
          string sangat mudah di JS,seperti mengubah menjadi
          lowerCase,UPPERCASE,memotong string menjadi array
          dan lain-lain
        */

        const name = "Eko Kurniawan Khannedy";
        console.info(name.length)
        console.info(name.toLowerCase())
        console.info(name.toUpperCase())
        console.info(name.split(" "))

        const input = "      input data               ";
        console.info(input.trim());
        console.info(input.trimRight());
        console.info(input.trimLeft());
        
    </script>
