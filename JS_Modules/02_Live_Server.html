<body>
    <script>
        /*
        Live Server
         -Saat kita menggunakan fitur JS Module,sangat
          disarankan  untuk menjalankan kode JS kita 
          dalam Web Server
         -Hal ini karena spesifikasi dari JS Module meminta
          secara default kode JS perlu di satu domain
          yang sama,jika kita membuat file html menggunakan
          URL file:// ,maka dikhawatirkan terjadi error CORS
          (Cross Origin Resource Sharing)

        Visual Studio Code
         -Jika menggunakan VS code,disarankan untuk menginstal
          plugin Live Server:
         -Plugin Live Server ini biasanya digunakan untuk
          menjalankan local web server,sehingga kita bisa
          mengakses kode web JS kita menggunakan domain localhost
        */
    </script>
</body>
</html>
